name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: Prepare routing inputs and map data
        run: python3 scripts/prepare.py --no-import
      - run: npm run build
      - run: npm run cloudflare:check
      - name: Build and smoke-test the Linux MOTIS image
        run: |
          docker build --platform linux/amd64 -t vallee-motis:ci .
          container=$(docker run --rm -d -p 127.0.0.1:18080:8080 vallee-motis:ci)
          trap 'docker stop "$container" >/dev/null || true' EXIT
          curl --fail --silent --show-error --max-time 5 --retry 20 --retry-all-errors --retry-delay 2 \
            'http://127.0.0.1:18080/api/v1/geocode?text=Chedde&numResults=1' |
            jq -e 'type == "array" and length > 0' > /dev/null
      - name: Deploy the Worker and MOTIS image to Cloudflare
        id: deploy
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/vallee-deploy.ndjson
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to repository Actions secrets}"
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to repository Actions secrets}"
          npx --no-install wrangler deploy
      - name: Verify the deployed router
        if: steps.deploy.outcome == 'success'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/vallee-deploy.ndjson
        run: |
          url=$(jq -ser '
            [.[] | select(.type == "deploy") | .targets[] |
              select(startswith("https://") and endswith(".workers.dev"))] | last
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          deadline=$((SECONDS + 300))
          until curl --fail --silent --show-error --max-time 100 "$url/api/health" |
            jq -e '.router == "ready"' > /dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::The deployed router did not become ready at $url"
              exit 1
            fi
            sleep 10
          done
          echo "Router ready at $url"
