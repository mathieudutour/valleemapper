<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#125451" />
    <meta
      name="description"
      content="Explorer les transports du Pays du Mont-Blanc : itinéraires, vélos, Citiz et Rézo Pouce."
    />
    <title>ValléeMapper — Pays du Mont-Blanc</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before first paint; src/theme.ts keeps it in sync afterwards.
      {
        let theme;
        try {
          theme = localStorage.getItem("valleemapper:theme");
        } catch {}
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
